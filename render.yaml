services:
  - type: web
    name: ag-video-cutter
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn server:app --workers 1 --threads 4 --timeout 3600 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MAX_UPLOAD_BYTES
        value: "2147483648"
